<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="岛屿心情 2026.04.17 美丽人生巡演上海站 纪念票根">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172432"/>
      <stop offset="52%" stop-color="#293d50"/>
      <stop offset="84%" stop-color="#7c6c78"/>
      <stop offset="100%" stop-color="#d49e8a"/>
    </linearGradient>
    <radialGradient id="bubbleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8ee" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#f7b2d9" stop-opacity="0.16"/>
      <stop offset="82%" stop-color="#7ee8fa" stop-opacity="0.42"/>
      <stop offset="94%" stop-color="#ffd89b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prismRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ce8ff"/>
      <stop offset="35%" stop-color="#ff9ad5"/>
      <stop offset="68%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <linearGradient id="imStub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ede6"/>
      <stop offset="100%" stop-color="#e4ddd3"/>
    </linearGradient>
    <mask id="imMask">
      <rect x="0" y="0" width="960" height="340" rx="18" fill="#ffffff"/>
      <circle cx="752" cy="0" r="16" fill="#000000"/>
      <circle cx="752" cy="340" r="16" fill="#000000"/>
      <circle cx="0" cy="170" r="10" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#imMask)">
