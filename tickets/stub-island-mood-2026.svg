    <!-- 右侧暖白纸质副券 -->
    <rect x="752" y="0" width="208" height="340" fill="url(#imStub)"/>
    <line x1="752" y1="18" x2="752" y2="322" stroke="#1e2d3d" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="856" y="48" text-anchor="middle" fill="#465b6e" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="2.2">ADMIT ONE</text>
    <text x="856" y="76" text-anchor="middle" fill="#172432" font-family="'Noto Serif SC', serif" font-size="21" font-weight="700" letter-spacing="2">美丽人生</text>
    <text x="856" y="98" text-anchor="middle" fill="#4f6478" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">2026.04.17 · SHA</text>

    <g transform="translate(788 122)" fill="#172432" opacity="0.84">
      <rect x="0" y="0" width="3" height="136"/><rect x="6" y="0" width="5" height="136"/>
      <rect x="15" y="0" width="2" height="136"/><rect x="21" y="0" width="4" height="136"/>
      <rect x="29" y="0" width="2" height="136"/><rect x="34" y="0" width="6" height="136"/>
      <rect x="44" y="0" width="3" height="136"/><rect x="50" y="0" width="2" height="136"/>
      <rect x="56" y="0" width="5" height="136"/><rect x="65" y="0" width="2" height="136"/>
      <rect x="70" y="0" width="4" height="136"/><rect x="78" y="0" width="6" height="136"/>
      <rect x="88" y="0" width="2" height="136"/><rect x="94" y="0" width="3" height="136"/>
      <rect x="101" y="0" width="5" height="136"/><rect x="110" y="0" width="2" height="136"/>
      <rect x="116" y="0" width="4" height="136"/><rect x="124" y="0" width="3" height="136"/>
      <rect x="130" y="0" width="4" height="136"/>
    </g>

    <text x="856" y="286" text-anchor="middle" fill="#172432" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">NO. SHA-260417</text>
    <text x="856" y="308" text-anchor="middle" fill="#687a8c" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1">MODERN SKY LAB</text>
