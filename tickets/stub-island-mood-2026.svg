    <rect x="20" y="18" width="712" height="304" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

    <!-- 眉标 -->
    <text x="42" y="54" fill="#d9e5f0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="2.4">ISLAND MOOD · 2026 NATIONAL TOUR</text>
    <rect x="598" y="38" width="112" height="22" rx="4" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.32"/>
    <text x="654" y="53" text-anchor="middle" fill="#fff9f2" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">SHANGHAI</text>

    <!-- 乐队与巡演主标题 -->
    <rect x="42" y="76" width="82" height="24" rx="4" fill="url(#prismRim)" fill-opacity="0.26" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="83" y="92" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">岛屿心情</text>

    <text x="42" y="156" fill="#ffffff" font-family="'Noto Serif SC', serif" font-size="48" font-weight="700" letter-spacing="4">美丽人生</text>
    <text x="266" y="154" fill="#f5dfd4" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" letter-spacing="1.5">新专辑巡演 · 上海站</text>

    <!-- 虚线分隔 -->
    <line x1="42" y1="214" x2="710" y2="214" stroke="#ffffff" stroke-opacity="0.24" stroke-dasharray="3 4"/>

    <!-- 底部演出信息 -->
