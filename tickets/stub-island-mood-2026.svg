      <text x="42" y="242" fill="#a8c4d8" font-size="10" letter-spacing="1.8">DATE &amp; TIME</text>
      <text x="42" y="268" fill="#ffffff" font-size="17" font-weight="700">2026.04.17 FRI · 20:00</text>
      <text x="42" y="294" fill="#cfdce8" font-size="11">2026 全国巡演 · 上海站</text>

      <text x="308" y="242" fill="#a8c4d8" font-size="10" letter-spacing="1.8">VENUE</text>
      <text x="308" y="268" fill="#ffffff" font-size="16" font-weight="700">Modern Sky LAB 摩登天空</text>
      <text x="308" y="294" fill="#cfdce8" font-size="11">上海虹口区 · 瑞虹天地月亮湾</text>
