    <rect x="0" y="0" width="752" height="340" fill="url(#skyBg)"/>

    <!-- 海浪层 -->
    <path d="M0 248 Q160 226 340 244 T752 232 L752 340 L0 340 Z" fill="#101d2b" opacity="0.72"/>
    <path d="M0 272 Q220 250 430 270 T752 260 L752 340 L0 340 Z" fill="#0b1521" opacity="0.82"/>

    <!-- 漂浮虹彩气泡 -->
    <g transform="translate(592 162)">
      <circle cx="0" cy="0" r="92" fill="url(#bubbleGlow)"/>
      <circle cx="0" cy="0" r="83" fill="none" stroke="url(#prismRim)" stroke-width="2.4" opacity="0.82"/>
      <ellipse cx="-28" cy="-32" rx="23" ry="11" transform="rotate(-28 -28 -32)" fill="#ffffff" opacity="0.32"/>
      <ellipse cx="36" cy="38" rx="14" ry="6" transform="rotate(-28 36 38)" fill="#ffe5b4" opacity="0.26"/>
    </g>

