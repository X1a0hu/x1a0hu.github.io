<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="自然友谊 2024 上海站 瓦肆 VAS est 纪念票根">
  <defs>
    <linearGradient id="mintPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cf7dc"/>
      <stop offset="100%" stop-color="#6ce8c8"/>
    </linearGradient>
    <mask id="zryMask">
      <rect x="0" y="0" width="960" height="340" rx="18" fill="#ffffff"/>
      <circle cx="752" cy="0" r="16" fill="#000000"/>
      <circle cx="752" cy="340" r="16" fill="#000000"/>
      <circle cx="0" cy="170" r="10" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#zryMask)">
    <!-- 主票面：电光薄荷绿 + 粗野主义纯黑（致敬 NF2024 官方海报） -->
    <rect x="0" y="0" width="752" height="340" fill="url(#mintPaper)"/>

    <!-- 背景超大 NF2024 水印 -->
    <text x="34" y="132" fill="#0a0e0d" opacity="0.09" font-family="'Space Grotesk', Impact, sans-serif" font-size="140" font-weight="700" letter-spacing="-6">NF2024</text>

    <!-- 右侧经典黑圆徽章 -->
    <g transform="translate(614 146)">
      <circle cx="0" cy="0" r="88" fill="#0a0e0d"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#7ef2d4" stroke-width="1.6" opacity="0.72"/>
      <!-- 简笔枝干意象 -->
      <path d="M-38 -22 Q-18 -38 -2 -18 T36 -28 M-14 -26 L-24 -44 M10 -22 L20 -42" fill="none" stroke="#7ef2d4" stroke-width="4.5" stroke-linecap="round"/>
      <text x="0" y="22" text-anchor="middle" fill="#7ef2d4" font-family="'Noto Serif SC', serif" font-size="25" font-weight="700" letter-spacing="3">自然友誼</text>
      <text x="0" y="42" text-anchor="middle" fill="#7ef2d4" font-family="'Space Grotesk', monospace" font-size="9.5" font-weight="700" letter-spacing="1.6">NATURAL FRIENDSHIP</text>
    </g>

    <!-- 粗黑边线框 -->
    <rect x="18" y="18" width="716" height="304" rx="8" fill="none" stroke="#0a0e0d" stroke-width="2"/>

    <!-- 眉标 -->
    <rect x="38" y="36" width="136" height="24" rx="3" fill="#0a0e0d"/>
    <text x="106" y="52" text-anchor="middle" fill="#7ef2d4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.6">NF2024 · LIVE</text>
    <text x="188" y="53" fill="#0a0e0d" font-family="'Noto Serif SC', serif" font-size="14" font-weight="700" letter-spacing="2">自然而然 · 友谊第一</text>

    <!-- 主标题与阵容 -->
    <text x="38" y="118" fill="#0a0e0d" font-family="'Space Grotesk', 'Noto Sans SC', sans-serif" font-size="42" font-weight="700" letter-spacing="1">自然友谊 2024</text>
    <text x="38" y="148" fill="#0a0e0d" font-family="'Noto Sans SC', sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">万能青年旅店 · 诱导社 · 深蓝儿童 · 鸡毛大乐队</text>
    <text x="38" y="172" fill="#0a0e0d" opacity="0.72" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.8">SHOP 15:00–18:00 幻觉贸易  /  LIVE 20:00</text>

    <!-- 黑色实线分隔 -->
    <line x1="38" y1="212" x2="508" y2="212" stroke="#0a0e0d" stroke-width="1.5"/>

    <!-- 演出元数据 -->
    <g font-family="'JetBrains Mono', 'Noto Sans SC', monospace" fill="#0a0e0d">
      <text x="38" y="240" opacity="0.65" font-size="10" font-weight="700" letter-spacing="1.6">DATE</text>
      <text x="38" y="266" font-size="18" font-weight="700">2024.11.29 FRI</text>
      <text x="38" y="292" opacity="0.78" font-size="11">SHANGHAI · 上海站</text>

      <text x="236" y="240" opacity="0.65" font-size="10" font-weight="700" letter-spacing="1.6">VENUE</text>
      <text x="236" y="266" font-size="17" font-weight="700">瓦肆 VAS est</text>
      <text x="236" y="292" opacity="0.78" font-size="11">徐汇区 Gate M 西岸梦中心 3号楼</text>
    </g>

    <!-- 右侧纯黑反转副券 -->
    <rect x="752" y="0" width="208" height="340" fill="#0a0e0d"/>
    <line x1="752" y1="18" x2="752" y2="322" stroke="#7ef2d4" stroke-opacity="0.72" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="856" y="48" text-anchor="middle" fill="#7ef2d4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="2.2">SHOWSTART</text>
    <text x="856" y="84" text-anchor="middle" fill="#7ef2d4" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" letter-spacing="1">11/29</text>
    <text x="856" y="106" text-anchor="middle" fill="#e6fff8" font-family="'Noto Sans SC', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2">上海 · 瓦肆</text>

    <g transform="translate(788 126)" fill="#7ef2d4" opacity="0.92">
      <rect x="0" y="0" width="5" height="132"/><rect x="8" y="0" width="2" height="132"/>
      <rect x="13" y="0" width="4" height="132"/><rect x="20" y="0" width="6" height="132"/>
      <rect x="30" y="0" width="2" height="132"/><rect x="35" y="0" width="4" height="132"/>
      <rect x="42" y="0" width="2" height="132"/><rect x="48" y="0" width="6" height="132"/>
      <rect x="58" y="0" width="3" height="132"/><rect x="64" y="0" width="2" height="132"/>
      <rect x="70" y="0" width="5" height="132"/><rect x="79" y="0" width="2" height="132"/>
      <rect x="85" y="0" width="4" height="132"/><rect x="93" y="0" width="6" height="132"/>
      <rect x="103" y="0" width="2" height="132"/><rect x="109" y="0" width="4" height="132"/>
      <rect x="117" y="0" width="3" height="132"/><rect x="124" y="0" width="2" height="132"/>
      <rect x="129" y="0" width="5" height="132"/>
    </g>

    <text x="856" y="286" text-anchor="middle" fill="#7ef2d4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">NO. SHA-241129</text>
    <text x="856" y="308" text-anchor="middle" fill="#6ca898" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1">VAS EST · SHANGHAI</text>
  </g>
</svg>
