<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="南青乐队 2024.07.05 轻舟已过万重山上海站 纪念票根">
  <defs>
    <linearGradient id="ricePaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2ede2"/>
      <stop offset="65%" stop-color="#e7e1d4"/>
      <stop offset="100%" stop-color="#d8d4c8"/>
    </linearGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#607067" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#607067" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f4038" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2f4038" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="nqStub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35443c"/>
      <stop offset="100%" stop-color="#24302a"/>
    </linearGradient>
    <mask id="nqMask">
      <rect x="0" y="0" width="960" height="340" rx="18" fill="#ffffff"/>
      <circle cx="752" cy="0" r="16" fill="#000000"/>
      <circle cx="752" cy="340" r="16" fill="#000000"/>
      <circle cx="0" cy="170" r="10" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#nqMask)">
    <!-- 主票面宣纸质感底色 -->
    <rect x="0" y="0" width="752" height="340" fill="url(#ricePaper)"/>

    <!-- 远山近峰水墨剪影（万重山） -->
    <path d="M290 218 Q360 112 430 162 T575 96 T752 154 L752 224 L290 224 Z" fill="url(#mtnFar)"/>
    <path d="M360 222 Q445 138 525 182 T670 128 T752 178 L752 224 L360 224 Z" fill="url(#mtnNear)"/>

    <!-- 江面微澜与一叶轻舟 -->
    <g transform="translate(556 186)">
      <path d="M-34 8 Q0 18 36 6 Q18 12 -18 12 Z" fill="#1e2722"/>
      <path d="M-4 8 L-2 -14 L18 4 Z" fill="#2c3a33" opacity="0.88"/>
      <line x1="-54" y1="20" x2="54" y2="20" stroke="#3c4f45" stroke-opacity="0.32" stroke-width="1.2"/>
      <line x1="-32" y1="26" x2="68" y2="26" stroke="#3c4f45" stroke-opacity="0.22" stroke-width="1"/>
    </g>

    <!-- 纸面细边框 -->
    <rect x="20" y="18" width="712" height="304" rx="10" fill="none" stroke="#2c3a33" stroke-opacity="0.24"/>

    <!-- 眉标与朱红印章 -->
    <text x="42" y="54" fill="#4f6157" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2.2">SONICE PRESENTS · 2024 UNPLUGGED TOUR</text>

    <!-- 朱红印章：南青 -->
    <g transform="translate(656 38)">
      <rect x="0" y="0" width="52" height="52" rx="6" fill="none" stroke="#b83b28" stroke-width="2.2"/>
      <rect x="4" y="4" width="44" height="44" rx="4" fill="#b83b28" fill-opacity="0.09"/>
      <text x="26" y="25" text-anchor="middle" fill="#b83b28" font-family="'Noto Serif SC', serif" font-size="16" font-weight="700">南</text>
      <text x="26" y="43" text-anchor="middle" fill="#b83b28" font-family="'Noto Serif SC', serif" font-size="16" font-weight="700">青</text>
    </g>

    <!-- 主标题 -->
    <text x="42" y="128" fill="#1d2621" font-family="'Noto Serif SC', serif" font-size="44" font-weight="700" letter-spacing="5">轻舟已过万重山</text>
    <text x="42" y="164" fill="#4a5c52" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="600" letter-spacing="1.5">南青乐队 · 2024 巡回演出 上海站（不插电专场）</text>

    <!-- 分隔虚线 -->
    <line x1="42" y1="214" x2="710" y2="214" stroke="#2c3a33" stroke-opacity="0.26" stroke-dasharray="3 4"/>

    <!-- 底部元数据 -->
    <g font-family="'JetBrains Mono', 'Noto Sans SC', monospace" fill="#1d2621">
      <text x="42" y="242" fill="#64756c" font-size="10" font-weight="700" letter-spacing="1.8">DATE</text>
      <text x="42" y="268" font-size="18" font-weight="700">2024.07.05 FRI</text>
      <text x="42" y="294" fill="#52645a" font-size="11">SHANGHAI · 上海站</text>

      <text x="256" y="242" fill="#64756c" font-size="10" font-weight="700" letter-spacing="1.8">VENUE</text>
      <text x="256" y="268" font-size="15.5" font-weight="700">万代南梦宫上海文化中心 · 梦想剧场</text>
      <text x="256" y="294" fill="#52645a" font-size="11">上海市普陀区宜昌路 179 号</text>
    </g>

    <!-- 右侧黛青副券 -->
    <rect x="752" y="0" width="208" height="340" fill="url(#nqStub)"/>
    <line x1="752" y1="18" x2="752" y2="322" stroke="#d8d4c8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="856" y="48" text-anchor="middle" fill="#b7c7bd" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="2.2">ADMIT ONE</text>
    <text x="856" y="76" text-anchor="middle" fill="#f2ede2" font-family="'Noto Serif SC', serif" font-size="22" font-weight="700" letter-spacing="3">轻舟</text>
    <text x="856" y="98" text-anchor="middle" fill="#c6d4cb" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">2024.07.05 · SHA</text>

    <g transform="translate(788 122)" fill="#efeae0" opacity="0.88">
      <rect x="0" y="0" width="4" height="136"/><rect x="7" y="0" width="3" height="136"/>
      <rect x="13" y="0" width="2" height="136"/><rect x="19" y="0" width="6" height="136"/>
      <rect x="28" y="0" width="2" height="136"/><rect x="34" y="0" width="4" height="136"/>
      <rect x="42" y="0" width="5" height="136"/><rect x="51" y="0" width="2" height="136"/>
      <rect x="56" y="0" width="3" height="136"/><rect x="63" y="0" width="6" height="136"/>
      <rect x="73" y="0" width="2" height="136"/><rect x="78" y="0" width="4" height="136"/>
      <rect x="86" y="0" width="3" height="136"/><rect x="93" y="0" width="2" height="136"/>
      <rect x="99" y="0" width="6" height="136"/><rect x="109" y="0" width="3" height="136"/>
      <rect x="116" y="0" width="4" height="136"/><rect x="124" y="0" width="2" height="136"/>
      <rect x="130" y="0" width="4" height="136"/>
    </g>

    <text x="856" y="286" text-anchor="middle" fill="#f2ede2" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">NO. SHA-240705</text>
    <text x="856" y="308" text-anchor="middle" fill="#9fb2a7" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1">DREAM HALL · SH</text>
  </g>
</svg>
