name: Deploy personal homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html gallery.html shelf.html notes.html about.html 404.html styles.css gallery.css shelf.css app.js gallery.js shelf.js site.config.js gallery.config.js shelf.config.js favicon.svg .nojekyll THIRD_PARTY_NOTICES.md _site/
          cp -R vendor _site/vendor
          cp -R photos _site/photos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for artifact indexing
        run: sleep 3
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
