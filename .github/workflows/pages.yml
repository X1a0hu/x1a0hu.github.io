name: Deploy personal homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html gallery.html shelf.html notes.html about.html 404.html styles.css gallery.css shelf.css app.js gallery.js shelf.js site.config.js gallery.config.js shelf.config.js favicon.svg .nojekyll THIRD_PARTY_NOTICES.md _site/
          cp -R vendor _site/vendor
          cp -R photos _site/photos
          cp -R covers _site/covers
          [ -d tickets ] && cp -R tickets _site/tickets || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
