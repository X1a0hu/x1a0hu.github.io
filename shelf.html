<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" id="meta-theme-color" />
    <meta name="description" content="HULAB 的书影音与实体唱片架，收纳真实拥有的 CD、黑胶、白胶、演出票根，以及读过的书和看过的影视。" />
    <meta property="og:title" content="书影音 · HULAB" />
    <meta property="og:description" content="实体唱片（CD / 黑胶 / 白胶）、演出票根、书与影视收藏架。" />
    <meta property="og:type" content="website" />
    <title>书影音 · HULAB</title>
    <link rel="icon" href="./favicon.svg?v=hulab" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="stylesheet" href="./shelf.css?v=hulab-9" />
    <script defer src="./site.config.js?v=hulab-2"></script>
    <script defer src="./shelf.config.js?v=hulab-7"></script>
    <script defer src="./shelf.js?v=hulab-8"></script>
  </head>
  <body>
    <div id="tfyi-bar">
      <a class="tfyi-back" href="./">← HULAB</a>
      <div class="tfyi-right">
        <span>My Shelf · <strong id="shelf-handle">@X1a0hu</strong></span>
      </div>
    </div>

    <div class="wrap">
      <header class="shelf-header">
        <h1 class="sr-only" id="shelf-title">书影音</h1>
        <div class="live" aria-label="馆藏作品总数">
          <canvas id="globe" width="88" height="88" aria-hidden="true"></canvas>
          <div class="live-meta">
            <strong id="total-count">0</strong>
            <span>件馆藏</span>
          </div>
        </div>
      </header>

      <main>
        <nav class="tabs" id="tabs" aria-label="媒介分类切换"></nav>

        <section class="box share-box" aria-labelledby="shelf-heading">
          <div class="shelf-controls">
            <div class="where-row">
              <div class="step-row">
                <h2 class="step" id="shelf-heading">Albums · 实体唱片</h2>
                <span class="count-pill" id="category-count">10</span>
                <div class="segmented" id="era-picker" role="group" aria-label="载体或时间筛选"></div>
              </div>

              <div class="right-tools">
                <div class="search-pill">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                  <input type="search" id="shelf-filter" placeholder="筛选唱片、载体或场馆..." aria-label="筛选当前分类作品" />
                </div>

                <div class="opts">
                  <button type="button" class="opt-toggle" id="toggle-jacket" aria-pressed="false" title="在侧脊旁展开选中专辑封面页">
                    <span class="opt-label">封面</span>
                    <span class="opt-track"><span class="opt-thumb"></span></span>
                  </button>
                  <button type="button" class="opt-toggle is-on" id="toggle-theme" aria-pressed="true" title="切换暗色/亮色主题">
                    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                    <span class="opt-track"><span class="opt-thumb"></span></span>
                  </button>
                </div>
              </div>
            </div>

            <div class="look-bar" id="look" role="tablist" aria-label="拟物展示样式切换"></div>
          </div>

          <div class="well">
            <div class="well-header">
              <span class="well-label" id="well-label">Preview · Physical Shelf</span>
              <button type="button" class="btn-secondary" id="download-png">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                <span>Download PNG</span>
              </button>
            </div>

            <div class="post" id="post-card">
              <div class="post-head">
                <div class="post-avatar" id="post-avatar" aria-hidden="true">H</div>
                <div class="post-byline">
                  <div class="by-row">
                    <strong id="post-author">HULAB</strong>
                    <span class="by-handle" id="post-handle">@X1a0hu · 实体收藏</span>
                  </div>
                  <p class="post-caption" id="post-caption">实体唱片 · 10 项记录</p>
                </div>
              </div>

              <div class="media-stage" id="media-stage" aria-live="polite"></div>
            </div>

            <div class="spotlight" id="spotlight">
              <div class="spotlight-cover-wrap" id="spotlight-cover-wrap"></div>
              <div class="spotlight-body">
                <div class="spotlight-top">
                  <span class="spotlight-rank" id="spotlight-rank">#01</span>
                  <span class="spotlight-year" id="spotlight-year">2010</span>
                  <span class="spotlight-rating" id="spotlight-rating">★ 10.0</span>
                  <span class="spotlight-formats" id="spotlight-formats"></span>
                </div>
                <h3 class="spotlight-title" id="spotlight-title">万能青年旅店</h3>
                <p class="spotlight-creator" id="spotlight-creator">万能青年旅店</p>
                <p class="spotlight-edition" id="spotlight-edition" hidden></p>
                <p class="spotlight-note" id="spotlight-note"></p>
              </div>
              <div class="spotlight-nav">
                <button type="button" class="spot-btn" id="spot-prev" aria-label="上一部作品">←</button>
                <button type="button" class="spot-btn" id="spot-next" aria-label="下一部作品">→</button>
              </div>
            </div>

            <div class="index-drawer">
              <div class="index-header">
                <span id="index-title">Full Shelf Index · 点击任意条目定位并查看详情</span>
                <span id="index-summary">Showing 10 items</span>
              </div>
              <ol class="lines" id="titles"></ol>
            </div>
          </div>
        </section>
      </main>

      <footer class="foot">
        <div class="tick">
          <span class="live-dot" aria-hidden="true"></span>
          <strong>Live</strong>
          <span class="tick-text" id="tick-text">点击架上的 CD 侧脊、黑胶/白胶唱片或演出票根，即可抽取查看版本详情与短评</span>
        </div>
        <a class="about-link" href="./">← 返回 HULAB 首页</a>
      </footer>
    </div>
  </body>
</html>
