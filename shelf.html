<!doctype html>
<html lang="zh-CN" data-theme="dark" id="top">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d0c" id="meta-theme-color" />
    <meta name="description" content="拾音，HULAB 的实体唱片与演出现场归档，收纳真实拥有的 CD、白胶与演出票根。" />
    <meta property="og:title" content="拾音 · HULAB" />
    <meta property="og:description" content="实体唱片（CD / 白胶）与演出现场票根收藏室。" />
    <meta property="og:type" content="website" />
    <title>拾音 · HULAB</title>
    <link rel="icon" href="./favicon.svg?v=hulab" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="stylesheet" href="./base.css?v=hulab-20" />
    <link rel="stylesheet" href="./shelf.css?v=hulab-20" />
    <script defer src="./site.config.js?v=hulab-20"></script>
    <script defer src="./shell.js?v=hulab-20"></script>
    <script defer src="./shelf.config.js?v=hulab-20"></script>
    <script defer src="./shelf.js?v=hulab-20"></script>
  </head>
  <body class="shelf-body">
    <a class="skip-link" href="#media-stage">跳到藏品陈列架</a>

    <div class="site-shell">
      <header class="site-header" data-site-header data-page="shelf">
        <a class="site-brand" href="./">
          <span class="site-brand-name">HULAB</span>
          <span class="site-brand-sep" aria-hidden="true">/</span>
          <span class="site-brand-section">拾音</span>
        </a>
        <nav class="site-nav" aria-label="全站主导航">
          <a class="site-nav-link" href="./">首页</a>
          <a class="site-nav-link" href="./gallery.html">画廊</a>
          <a class="site-nav-link" href="./shelf.html" aria-current="page">书影音</a>
          <a class="site-nav-link" href="./notes.html">笔记</a>
          <a class="site-nav-link" href="./about.html">关于</a>
        </nav>
      </header>

      <main class="shelf-main site-container" aria-labelledby="shelf-title">
        <section class="page-hero shelf-hero">
          <div>
            <p class="page-eyebrow">PHYSICAL RECORDS &amp; LIVE ARCHIVE</p>
            <h1 class="page-title" id="shelf-title">拾音</h1>
          </div>
          <div class="page-intro">
            <p class="page-subtitle" id="shelf-subtitle">把真正拥有的实体唱片与去过的演出现场，安静收进架子里。</p>
            <p class="page-meta" id="shelf-summary"></p>
          </div>
        </section>

        <nav class="tabs" id="tabs" aria-label="媒介分类切换"></nav>

        <section class="box share-box" aria-labelledby="shelf-heading">
          <div class="shelf-controls">
            <div class="where-row">
              <div class="step-row">
                <h2 class="step" id="shelf-heading">Albums · 实体唱片</h2>
                <span class="count-pill" id="category-count">12</span>
                <div class="segmented" id="era-picker" role="group" aria-label="载体或年份筛选"></div>
              </div>

              <div class="right-tools">
                <div class="search-pill">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                  <input type="search" id="shelf-filter" placeholder="筛选唱片、载体或场馆..." aria-label="筛选当前分类作品" />
                </div>

                <div class="opts">
                  <button type="button" class="opt-toggle" id="toggle-jacket" aria-pressed="false" title="在侧脊旁展开选中专辑封面页">
                    <span class="opt-label">封面</span>
                    <span class="opt-track"><span class="opt-thumb"></span></span>
                  </button>
                  <button type="button" class="opt-toggle is-on" id="toggle-theme" aria-pressed="true" title="切换暗房/暖纸主题">
                    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                    <span class="opt-track"><span class="opt-thumb"></span></span>
                  </button>
                </div>
              </div>
            </div>

            <div class="look-bar" id="look" role="tablist" aria-label="拟物展示样式切换"></div>
          </div>

          <div class="well">
            <div class="post" id="post-card">
              <div class="media-stage" id="media-stage" aria-live="polite"></div>
            </div>

            <div class="spotlight" id="spotlight">
              <div class="spotlight-cover-wrap" id="spotlight-cover-wrap"></div>
              <div class="spotlight-body">
                <div class="spotlight-top">
                  <span class="spotlight-rank" id="spotlight-rank">#01</span>
                  <span class="spotlight-year" id="spotlight-year">2010</span>
                  <span class="spotlight-rating" id="spotlight-rating" hidden></span>
                  <span class="spotlight-formats" id="spotlight-formats"></span>
                </div>
                <h3 class="spotlight-title" id="spotlight-title">万能青年旅店</h3>
                <p class="spotlight-creator" id="spotlight-creator">万能青年旅店</p>
                <p class="spotlight-edition" id="spotlight-edition" hidden></p>
                <p class="spotlight-note" id="spotlight-note"></p>
              </div>
              <div class="spotlight-nav">
                <button type="button" class="spot-btn" id="spot-prev" aria-label="上一项">←</button>
                <button type="button" class="spot-btn" id="spot-next" aria-label="下一项">→</button>
              </div>
            </div>

            <div class="index-drawer">
              <div class="index-header">
                <span id="index-title">馆藏索引 · 点击任意条目定位详情</span>
                <span id="index-summary">共 12 项</span>
              </div>
              <ol class="lines" id="titles"></ol>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer" data-site-footer>
        <p>© 2026 HULAB</p>
      </footer>
    </div>
  </body>
</html>
