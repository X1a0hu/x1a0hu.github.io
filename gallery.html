<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d0c" />
    <meta name="description" content="浮光，HULAB 的个人影像集。记录日常、光影与旅途。" />
    <meta property="og:title" content="浮光 · HULAB" />
    <meta property="og:description" content="你总不忘提醒，再写上一些实况吧。" />
    <meta property="og:type" content="website" />
    <title>浮光 · HULAB</title>
    <link rel="icon" href="./favicon.svg?v=hulab" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="stylesheet" href="./styles.css?v=hulab-3" />
    <link rel="stylesheet" href="./gallery.css?v=hulab-18" />
    <script defer src="./site.config.js?v=hulab-2"></script>
    <script defer src="./gallery.config.js?v=hulab-18"></script>
    <script defer src="./gallery.js?v=hulab-18"></script>
  </head>
  <body class="gallery-body">
    <a class="skip-link" href="#gallery-grid">跳到影像胶卷</a>

    <div class="gallery-page">
      <header class="gallery-topbar gallery-container">
        <a class="gallery-brand" href="./" aria-label="HULAB，回到首页">
          <span class="brand-name">HULAB</span>
          <span class="brand-divider" aria-hidden="true">/</span>
          <span class="brand-section">影像集</span>
        </a>
        <a class="back-home-link" href="./">返回首页 <span aria-hidden="true">↗</span></a>
      </header>

      <main class="gallery-main" aria-labelledby="gallery-title">
        <section class="gallery-hero gallery-container">
          <div class="gallery-heading">
            <h1 class="gallery-title" id="gallery-title">浮光</h1>
          </div>
          <div class="gallery-intro">
            <p class="gallery-subtitle" id="gallery-subtitle">你总不忘提醒，再写上一些实况吧。</p>
            <p class="archive-range" id="archive-range"></p>
          </div>
        </section>

        <section class="gallery-controls gallery-container" aria-label="画廊分类筛选">
          <div class="filter-bar" id="filter-bar" role="group" aria-label="按分类筛选照片"></div>
        </section>

        <p class="gallery-count sr-only" id="gallery-count" aria-live="polite"></p>

        <section class="film-stage" aria-label="35mm 影像胶卷">
          <div class="gallery-grid is-film" id="gallery-grid" tabindex="-1">
            <noscript><p class="empty-note">请启用 JavaScript 以浏览影像集。</p></noscript>
          </div>
        </section>

        <div class="gallery-container">
          <aside class="now-card" id="now-card" hidden>
            <div class="now-badge-wrap">
              <span class="live-pulse" aria-hidden="true"></span>
              <span class="now-badge" id="now-badge">实况</span>
            </div>
            <p class="now-text" id="now-text">正在搭建个人空间的暗房画廊，把日常随手拍和即时想法慢慢收纳进这里。</p>
            <div class="now-meta">
              <span class="now-mood" id="now-mood">夜间模式</span>
              <span class="meta-dot" aria-hidden="true">·</span>
              <time class="now-time" id="now-time">2026.11.21</time>
            </div>
          </aside>
        </div>
      </main>

      <footer class="gallery-footer gallery-container">
        <p>© <span id="year">2026</span> <span id="footer-name">HULAB</span></p>
        <a href="#gallery-title">回到顶部 <span aria-hidden="true">↑</span></a>
      </footer>
    </div>

    <dialog class="lightbox" id="lightbox-dialog" aria-labelledby="lightbox-title">
      <div class="lightbox-container">
        <header class="lightbox-topbar">
          <div class="lightbox-counter-group">
            <span class="lightbox-index" id="lightbox-index">01 / 04</span>
            <span class="lightbox-subcount" id="lightbox-subcount" hidden></span>
          </div>
          <div class="lightbox-actions">
            <button class="lightbox-live-btn" type="button" id="lightbox-live-btn" hidden aria-pressed="false" aria-label="播放实况动态">
              <span class="live-icon" aria-hidden="true"></span>
              <span>实况</span>
            </button>
            <button class="lightbox-close" type="button" id="lightbox-close" aria-label="关闭大图预览">
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </header>

        <div class="lightbox-stage">
          <button class="stage-nav stage-prev" type="button" id="lightbox-prev" aria-label="上一组照片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>

          <figure class="lightbox-figure" id="lightbox-figure">
            <div class="lightbox-media-wrap" id="lightbox-media-wrap">
              <img class="lightbox-img" id="lightbox-img" alt="" />
              <video class="lightbox-video" id="lightbox-video" muted loop playsinline hidden></video>
            </div>
          </figure>

          <button class="stage-nav stage-next" type="button" id="lightbox-next" aria-label="下一组照片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <aside class="lightbox-info">
          <div class="lightbox-caption">
            <h2 class="lightbox-title" id="lightbox-title"></h2>
            <p class="lightbox-note" id="lightbox-note"></p>
          </div>

          <div class="lightbox-aside">
            <dl class="lightbox-meta-list" id="lightbox-meta-list">
              <div class="meta-item" id="lightbox-date-wrap">
                <dt class="meta-label">日期</dt>
                <dd class="meta-value" id="lightbox-date"></dd>
              </div>
              <div class="meta-item" id="lightbox-location-wrap">
                <dt class="meta-label">地点</dt>
                <dd class="meta-value" id="lightbox-location"></dd>
              </div>
              <div class="meta-item" id="lightbox-exif-wrap">
                <dt class="meta-label">参数</dt>
                <dd class="meta-value is-mono" id="lightbox-exif"></dd>
              </div>
            </dl>
            <div class="lightbox-thumbs" id="lightbox-thumbs" hidden aria-label="同组照片切换"></div>
          </div>
        </aside>
      </div>
    </dialog>
  </body>
</html>
