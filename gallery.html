<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" />
    <meta name="description" content="浮光，HULAB 的个人影像集。记录日常、光影与旅途。" />
    <meta property="og:title" content="浮光 · HULAB" />
    <meta property="og:description" content="你总不忘提醒，再写上一些实况吧。" />
    <meta property="og:type" content="website" />
    <title>浮光 · HULAB</title>
    <link rel="icon" href="./favicon.svg?v=hulab" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=hulab-2" />
    <link rel="stylesheet" href="./gallery.css?v=hulab-6" />
    <script defer src="./site.config.js?v=hulab-2"></script>
    <script defer src="./gallery.config.js?v=hulab-6"></script>
    <script defer src="./gallery.js?v=hulab-6"></script>
  </head>
  <body class="gallery-body">
    <a class="skip-link" href="#gallery-grid">跳到照片墙</a>

    <div class="gallery-shell">
      <header class="gallery-topbar">
        <a class="gallery-brand" href="./" aria-label="HULAB，回到首页">
          <span>HULAB<span class="brand-dot">.</span></span>
          <span class="brand-divider" aria-hidden="true">/</span>
          <span class="brand-section">影像集</span>
        </a>
        <a class="back-home-link" href="./">返回首页 <span aria-hidden="true">↗</span></a>
      </header>

      <main class="gallery-main" aria-labelledby="gallery-title">
        <section class="gallery-hero">
          <div class="gallery-heading">
            <p class="gallery-eyebrow" id="gallery-eyebrow">A VISUAL JOURNAL</p>
            <h1 class="gallery-title" id="gallery-title">浮光<span class="title-period" aria-hidden="true">.</span></h1>
          </div>
          <div class="gallery-intro">
            <span class="archive-label">THE PERSONAL ARCHIVE <span aria-hidden="true">↙</span></span>
            <p class="gallery-subtitle" id="gallery-subtitle">你总不忘提醒，再写上一些实况吧。</p>
            <p class="archive-range" id="archive-range"></p>
          </div>
        </section>

        <section class="gallery-controls" aria-label="画廊浏览方式">
          <div class="filter-bar" id="filter-bar" role="group" aria-label="按分类筛选照片"></div>
          <div class="view-switcher" role="group" aria-label="画廊布局切换">
            <button class="view-btn is-active" type="button" data-view-mode="polaroid" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18"/><path d="M7 6h10v9H7z"/></svg>
              <span>拍立得</span>
            </button>
            <button class="view-btn" type="button" data-view-mode="film" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="1"/><path d="M2 7h20M2 17h20M7 3v4m5-4v4m5-4v4M7 17v4m5-4v4m5-4v4"/></svg>
              <span>胶卷</span>
            </button>
          </div>
        </section>

        <p class="gallery-count sr-only" id="gallery-count" aria-live="polite"></p>
        <div class="film-controls" id="film-controls" hidden>
          <p id="film-hint">横向滑动胶卷 · 点击照片放大</p>
          <div class="film-navigation" role="group" aria-label="滚动胶卷">
            <button type="button" id="film-prev" aria-label="向前滚动胶卷" aria-controls="gallery-grid">←</button>
            <button type="button" id="film-next" aria-label="向后滚动胶卷" aria-controls="gallery-grid">→</button>
          </div>
        </div>
        <section class="gallery-grid is-polaroid" id="gallery-grid" aria-label="实况照片墙">
          <noscript><p class="empty-note">请启用 JavaScript 以浏览照片。</p></noscript>
        </section>

          <aside class="now-card" id="now-card" hidden>
            <div class="now-badge-wrap">
              <span class="live-pulse" aria-hidden="true"></span>
              <span class="now-badge" id="now-badge">实况 · NOW</span>
            </div>
            <p class="now-text" id="now-text">正在搭建个人空间的暗房画廊，把日常随手拍和即时想法慢慢收纳进这里。</p>
            <div class="now-meta">
              <span class="now-mood" id="now-mood">🌌 夜间模式</span>
              <span class="meta-dot" aria-hidden="true">·</span>
              <time class="now-time" id="now-time">2026.11.21</time>
            </div>
          </aside>
      </main>

      <footer class="gallery-footer">
        <p>© <span id="year">2026</span> <span id="footer-name">HULAB</span></p>
        <span class="footer-caption">MOMENTS, COLLECTED.</span>
        <a href="#gallery-title">回到顶部 <span aria-hidden="true">↑</span></a>
      </footer>
    </div>

    <dialog class="lightbox" id="lightbox-dialog" aria-labelledby="lightbox-title">
      <div class="lightbox-container">
        <button class="close-panel lightbox-close" type="button" id="lightbox-close" aria-label="关闭暗房预览">
          <span aria-hidden="true">×</span>
        </button>

        <div class="lightbox-stage">
          <button class="stage-nav stage-prev" type="button" id="lightbox-prev" aria-label="上一组照片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>

          <figure class="lightbox-figure" id="lightbox-figure">
            <div class="lightbox-media-wrap" id="lightbox-media-wrap">
              <img class="lightbox-img" id="lightbox-img" alt="" />
              <video class="lightbox-video" id="lightbox-video" muted loop playsinline hidden></video>
              <button class="live-pill lightbox-live-btn" type="button" id="lightbox-live-btn" hidden aria-label="播放实况动态">
                <span class="live-icon" aria-hidden="true"></span>
                <span>LIVE</span>
              </button>
            </div>
            <div class="lightbox-thumbs" id="lightbox-thumbs" hidden aria-label="同组照片切换"></div>
          </figure>

          <button class="stage-nav stage-next" type="button" id="lightbox-next" aria-label="下一组照片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <aside class="lightbox-info">
          <div class="lightbox-info-top">
            <p class="panel-eyebrow" id="lightbox-index">MOMENT · 01 / 04</p>
            <div class="lightbox-chips">
              <span class="card-tag" id="lightbox-tag">实况</span>
              <span class="card-date" id="lightbox-date"></span>
            </div>
            <h2 class="lightbox-title" id="lightbox-title"></h2>
            <p class="lightbox-note" id="lightbox-note"></p>
          </div>

          <div class="lightbox-meta-list">
            <div class="meta-item" id="lightbox-location-wrap">
              <span class="meta-label">位置</span>
              <span class="meta-value" id="lightbox-location"></span>
            </div>
            <div class="meta-item" id="lightbox-exif-wrap">
              <span class="meta-label">参数 / 记录</span>
              <span class="meta-value" id="lightbox-exif"></span>
            </div>
          </div>
        </aside>
      </div>
    </dialog>
  </body>
</html>
