<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#66c7f4" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#193549" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#05080c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="82%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffcc84" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7c4f2b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05080c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="750" fill="#06090e"/>
  <rect width="1000" height="750" fill="url(#screenGlow)"/>
  <rect width="1000" height="750" fill="url(#lampGlow)"/>
  <!-- Desk surface -->
  <rect x="0" y="540" width="1000" height="210" fill="#080d13"/>
  <line x1="0" y1="540" x2="1000" y2="540" stroke="#98d6f5" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- Minimalist monitor silhouette -->
  <rect x="270" y="180" width="460" height="280" rx="14" fill="#0b1520" stroke="#8ad8ff" stroke-opacity="0.32" stroke-width="2"/>
