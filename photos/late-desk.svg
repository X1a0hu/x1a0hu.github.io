<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="55%" stop-color="#d5e8fc"/>
      <stop offset="100%" stop-color="#b4d4f7"/>
    </linearGradient>
    <radialGradient id="sunlight" cx="76%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#e3f1ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b4d4f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4e8c"/>
      <stop offset="100%" stop-color="#102c54"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#wall)"/>
  <rect width="1000" height="750" fill="url(#sunlight)"/>
  <!-- Window light beam -->
  <polygon points="620,0 1000,0 1000,540 380,540" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Clean white desk surface -->
  <rect x="0" y="540" width="1000" height="210" fill="#f7fbff"/>
  <line x1="0" y1="540" x2="1000" y2="540" stroke="#8ab8e6" stroke-opacity="0.55" stroke-width="2"/>
  <!-- Minimalist silver/white & blue monitor -->
  <rect x="270" y="180" width="460" height="280" rx="16" fill="url(#screen)" stroke="#ffffff" stroke-width="8"/>
  <!-- Code lines on screen -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="315" y1="235" x2="420" y2="235" stroke="#7cc4ff" stroke-opacity="0.9"/>
    <line x1="440" y1="235" x2="530" y2="235" stroke="#ffffff" stroke-opacity="0.65"/>
    <line x1="340" y1="268" x2="580" y2="268" stroke="#a6d8ff" stroke-opacity="0.75"/>
    <line x1="340" y1="301" x2="490" y2="301" stroke="#ffffff" stroke-opacity="0.85"/>
    <line x1="340" y1="334" x2="630" y2="334" stroke="#85c8ff" stroke-opacity="0.65"/>
    <line x1="315" y1="367" x2="450" y2="367" stroke="#7cc4ff" stroke-opacity="0.85"/>
    <line x1="315" y1="400" x2="380" y2="400" stroke="#c7e6ff" stroke-opacity="0.6"/>
  </g>
  <!-- Monitor stand -->
  <rect x="482" y="464" width="36" height="58" fill="#b9d2eb"/>
  <rect x="420" y="520" width="160" height="10" rx="5" fill="#9abce0"/>
  <!-- White & blue ceramic mug -->
  <rect x="760" y="472" width="52" height="58" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M812 486 C830 486 830 516 812 516" fill="none" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M776 454 Q782 438 776 424 M796 454 Q802 436 795 420" fill="none" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="2.2" stroke-linecap="round"/>
</svg>
