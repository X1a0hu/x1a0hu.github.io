    <line x1="440" y1="235" x2="530" y2="235" stroke="#c3e8ff" stroke-opacity="0.35"/>
    <line x1="340" y1="268" x2="580" y2="268" stroke="#9be2ff" stroke-opacity="0.45"/>
    <line x1="340" y1="301" x2="490" y2="301" stroke="#ffd28a" stroke-opacity="0.55"/>
    <line x1="340" y1="334" x2="630" y2="334" stroke="#89c4e1" stroke-opacity="0.35"/>
    <line x1="315" y1="367" x2="450" y2="367" stroke="#7fd8ff" stroke-opacity="0.55"/>
    <line x1="315" y1="400" x2="380" y2="400" stroke="#9be2ff" stroke-opacity="0.3"/>
