<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e62d0"/>
      <stop offset="48%" stop-color="#4ea1f5"/>
      <stop offset="82%" stop-color="#a7d7ff"/>
      <stop offset="100%" stop-color="#e8f5ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#cbe8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4ea1f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9be8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2e6ec2" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2864b8"/>
      <stop offset="100%" stop-color="#163e7a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#sunGlow)"/>
  <!-- Sun & halo -->
  <circle cx="864" cy="224" r="56" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="864" cy="224" r="120" fill="#ffffff" fill-opacity="0.22"/>
  <!-- Soft layered white clouds -->
  <g fill="#ffffff" fill-opacity="0.82">
    <ellipse cx="280" cy="430" rx="170" ry="44"/>
    <ellipse cx="380" cy="420" rx="130" ry="52"/>
    <ellipse cx="210" cy="442" rx="110" ry="34"/>
    <ellipse cx="780" cy="470" rx="190" ry="38" fill-opacity="0.68"/>
    <ellipse cx="890" cy="458" rx="140" ry="46" fill-opacity="0.74"/>
  </g>
  <!-- Distant blue hills -->
  <path d="M0 595 Q240 515 490 572 T960 540 T1200 575 L1200 800 L0 800 Z" fill="url(#ridge1)"/>
  <path d="M0 648 Q340 585 660 632 T1200 612 L1200 800 L0 800 Z" fill="url(#ridge2)"/>
</svg>
