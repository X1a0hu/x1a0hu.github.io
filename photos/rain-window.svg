<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ecff"/>
      <stop offset="50%" stop-color="#89c2fa"/>
      <stop offset="100%" stop-color="#357de0"/>
    </linearGradient>
    <radialGradient id="b1" cx="34%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#bfe2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#357de0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="72%" cy="64%" r="42%">
      <stop offset="0%" stop-color="#e3f3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7ab8f5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#357de0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1125" fill="url(#bg)"/>
  <rect width="900" height="1125" fill="url(#b1)"/>
  <rect width="900" height="1125" fill="url(#b2)"/>
  <!-- Luminous white & ice-blue bokeh circles -->
  <g>
    <circle cx="310" cy="450" r="76" fill="#ffffff" fill-opacity="0.34"/>
    <circle cx="310" cy="450" r="38" fill="#ffffff" fill-opacity="0.78"/>
    <circle cx="630" cy="670" r="88" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="630" cy="670" r="42" fill="#ffffff" fill-opacity="0.72"/>
    <circle cx="540" cy="360" r="52" fill="#f0f8ff" fill-opacity="0.42"/>
    <circle cx="230" cy="720" r="58" fill="#e6f4ff" fill-opacity="0.38"/>
    <circle cx="465" cy="590" r="32" fill="#ffffff" fill-opacity="0.62"/>
  </g>
