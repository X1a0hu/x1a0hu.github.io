<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1824"/>
      <stop offset="52%" stop-color="#091119"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="neonCyan" cx="35%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#6ad5ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#236482" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonAmber" cx="72%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#ffb86c" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#b85d3b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1125" fill="url(#bg)"/>
  <rect width="900" height="1125" fill="url(#neonCyan)"/>
  <rect width="900" height="1125" fill="url(#neonAmber)"/>
  <!-- Bokeh circles on rainy window -->
  <g>
    <circle cx="310" cy="460" r="68" fill="#8be3ff" fill-opacity="0.22"/>
    <circle cx="310" cy="460" r="34" fill="#d9f7ff" fill-opacity="0.46"/>
    <circle cx="640" cy="680" r="82" fill="#ffbe73" fill-opacity="0.22"/>
    <circle cx="640" cy="680" r="38" fill="#ffe4bf" fill-opacity="0.48"/>
    <circle cx="540" cy="390" r="46" fill="#9bc9ff" fill-opacity="0.18"/>
    <circle cx="220" cy="720" r="52" fill="#70bfff" fill-opacity="0.16"/>
    <circle cx="460" cy="610" r="28" fill="#ffd099" fill-opacity="0.32"/>
  </g>
  <!-- Rain streaks -->
  <g stroke="#bfeaff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round">
    <line x1="180" y1="120" x2="150" y2="280"/>
    <line x1="290" y1="220" x2="255" y2="410"/>
    <line x1="420" y1="90" x2="385" y2="260"/>
    <line x1="590" y1="180" x2="550" y2="390"/>
    <line x1="740" y1="140" x2="705" y2="310"/>
    <line x1="240" y1="540" x2="205" y2="730"/>
    <line x1="480" y1="490" x2="442" y2="690"/>
    <line x1="680" y1="520" x2="640" y2="740"/>
    <line x1="360" y1="770" x2="325" y2="960"/>
    <line x1="580" y1="810" x2="545" y2="990"/>
  </g>
</svg>
